      - name: Verify optimized source markers
        run: |
          grep -q "customerContactsCache" BaoKhanhInvoice/ContentView.swift
          grep -q "historyInvoicesCache" BaoKhanhInvoice/ContentView.swift
          grep -q "revenueTodayCache" BaoKhanhInvoice/ContentView.swift
          grep -q "cache.countLimit = 100" BaoKhanhInvoice/QRCodeImage.swift
          echo "Source patch verified."

      - name: Build app without signing
        run: |
          xcodebuild clean build \
            -project "BaoKhanhInvoice.xcodeproj" \
            -scheme "BaoKhanhInvoice" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/BaoKhanhInvoice.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Không tìm thấy app tại: $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 3 -type d
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r BaoKhanhInvoice-iOS27-Optimized-unsigned.ipa Payload

      - name: Package patched source
        run: |
          mkdir -p build/patched-source
          cp BaoKhanhInvoice/ContentView.swift build/patched-source/
          cp BaoKhanhInvoice/Models.swift build/patched-source/
          cp BaoKhanhInvoice/QRCodeImage.swift build/patched-source/
          cd build/patched-source
          zip BaoKhanhInvoice-iOS27-patched-files.zip ContentView.swift Models.swift QRCodeImage.swift

      - name: Upload optimized unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaoKhanhInvoice-iOS27-Optimized-Unsigned-IPA
          path: build/ipa/BaoKhanhInvoice-iOS27-Optimized-unsigned.ipa

      - name: Upload patched source files
        uses: actions/upload-artifact@v4
        with:
          name: BaoKhanhInvoice-iOS27-Patched-Source
          path: build/patched-source/BaoKhanhInvoice-iOS27-patched-files.zip
